global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: learning-roadmap-api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
    # In production, add a bearer_token_file backed by the secret manager when
    # METRICS_AUTH_TOKEN is configured. Keep Prometheus and the API private.
