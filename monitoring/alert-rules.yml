groups:
  - name: learning-roadmap-availability
    rules:
      - alert: LearningRoadmapApiUnavailable
        expr: up{job="learning-roadmap-api"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Learning Roadmap API is unavailable
          description: The Prometheus scrape target has been unavailable for five minutes.

      - alert: LearningRoadmapApiServerErrors
        expr: sum(rate(roadmap_http_responses_total{status=~"5.."}[5m])) / clamp_min(sum(rate(roadmap_http_requests_total[5m])), 1) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Learning Roadmap API 5xx rate is elevated
          description: More than five percent of API responses have been 5xx for ten minutes.

      - alert: LearningRoadmapDocumentFailures
        expr: increase(roadmap_document_worker_total{outcome="failed"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Document processing reached terminal failure
          description: Review the admin processing summary and the resource processing error.

      - alert: LearningRoadmapWorkerLeaseExpired
        expr: increase(roadmap_document_worker_total{outcome="lease_expired"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Document worker lease expired
          description: A document processing job exceeded its lease timeout and was recovered.
