name: Compose runtime smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docker-compose.yaml'
      - 'backend/**'
      - 'frontend/**'
      - 'ml/**'
      - 'scripts/**'
      - '.github/workflows/compose-smoke.yml'

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Start stack
        env:
          POSTGRES_PASSWORD: compose-ci-password
          SECRET_KEY: compose-ci-secret-key-change-me
        run: docker compose up --build --detach
      - name: Verify health and readiness
        shell: bash
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/health/ready && break
            sleep 5
          done
          curl --fail --silent http://127.0.0.1:5173/health
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
