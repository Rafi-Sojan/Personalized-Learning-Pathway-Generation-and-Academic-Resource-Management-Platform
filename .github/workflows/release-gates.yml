name: Release gates

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  repository-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ocr.txt
            backend/requirements-storage.txt
            ml/requirements.txt
      - name: Install backend and ML dependencies
        run: python -m pip install -r backend/requirements.txt -r ml/requirements.txt
      - name: Run Python test suites
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests ml/tests tests --junitxml=test-results.xml
      - name: Run Ruff
        run: python -m ruff check backend ml tests conftest.py
      - name: Run mypy
        run: python -m mypy backend/app --ignore-missing-imports
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt -r backend/requirements-ocr.txt -r backend/requirements-storage.txt -r ml/requirements.txt
      - name: Validate RVCE source candidates
        run: python scripts/validate_rvce_courses.py database/rvce_course_candidates.json
      - name: Verify controlled release invariants
        run: python scripts/verify_release.py
      - name: Compile repository Python modules
        run: python -m compileall -q backend ml tests scripts conftest.py
      - name: Run learning-quality regression gate
        run: python scripts/evaluate_learning.py ml/evaluation/benchmark.example.json --minimum mapping_f1=0.80 --minimum matcher_precision=0.90 --minimum matcher_f1=0.90 --minimum matcher_abstention_accuracy=0.90 --minimum ranking_ndcg=0.80 --minimum historical_ranking_ndcg=0.80
      - name: Publish Python test report
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.2
        with:
          name: release-python-test-results
          path: test-results.xml

  scoring-engine-release-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure CMake
        run: cmake -S scoring-engine -B scoring-engine/build -DCMAKE_BUILD_TYPE=Release
      - name: Build scoring engine
        run: cmake --build scoring-engine/build --config Release --parallel
      - name: Run native tests
        run: ctest --test-dir scoring-engine/build --build-config Release --output-on-failure

  frontend-release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm CLI
        run: npm install --global npm@11.21.1
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance tests
        run: npm run test:e2e

  runtime-release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Start complete Compose stack
        env:
          POSTGRES_PASSWORD: release-ci-database-password
          SECRET_KEY: release-ci-signing-secret-change-me
        run: docker compose up --build --detach
      - name: Verify readiness, frontend, and load baseline
        env:
          POSTGRES_PASSWORD: release-ci-database-password
          SECRET_KEY: release-ci-signing-secret-change-me
        run: |
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:8000/health/ready && break || sleep 5; done
          curl --fail --silent http://127.0.0.1:5173/health
          python scripts/load_test.py --url http://127.0.0.1:8000/health/ready --requests 100 --workers 10
      - name: Verify database backup and restore
        env:
          POSTGRES_PASSWORD: release-ci-database-password
          SECRET_KEY: release-ci-signing-secret-change-me
        run: |
          docker compose exec -T postgres pg_dump -U learning -d learning -Fc > release-backup.dump
          docker compose exec -T postgres createdb -U learning learning_restore
          docker compose exec -T postgres pg_restore -U learning -d learning_restore --no-owner < release-backup.dump
          docker compose exec -T postgres psql -U learning -d learning_restore -c 'SELECT COUNT(*) FROM users'
      - name: Show logs if a release check fails
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        env:
          POSTGRES_PASSWORD: release-ci-database-password
          SECRET_KEY: release-ci-signing-secret-change-me
        run: docker compose down --volumes

