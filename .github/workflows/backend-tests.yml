name: Backend and ML checks

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'ml/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'ml/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            ml/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt -r ml/requirements.txt

      - name: Run Python tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests ml/tests tests --junitxml=test-results.xml

      - name: Run Ruff checks
        run: python -m ruff check backend ml tests --output-format=github

      - name: Run mypy checks
        run: python -m mypy backend/app --ignore-missing-imports

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r backend/requirements.txt -r ml/requirements.txt

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: test-results.xml
