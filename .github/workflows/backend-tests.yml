name: Backend and ML checks

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'ml/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'ml/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            ml/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt -r ml/requirements.txt

      - name: Run Python tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests ml/tests tests --junitxml=test-results.xml

      - name: Run Ruff checks
        run: python -m ruff check backend ml tests --output-format=github

      - name: Run mypy checks
        run: python -m mypy backend/app --ignore-missing-imports

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt -r ml/requirements.txt

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.2
        with:
          name: python-test-results
          path: test-results.xml

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: learning
          POSTGRES_USER: learning
          POSTGRES_PASSWORD: learning-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learning -d learning"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            ml/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt -r ml/requirements.txt

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+psycopg://learning:learning-ci@localhost:5432/learning
        run: alembic -c backend/alembic.ini upgrade head

      - name: Run service integration checks
        env:
          INTEGRATION_TESTS: '1'
          DATABASE_URL: postgresql+psycopg://learning:learning-ci@localhost:5432/learning
          REDIS_URL: redis://localhost:6379/0
        run: python -m pytest tests/integration -q
